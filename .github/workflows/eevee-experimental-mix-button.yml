name: Experimental Spotify Mix button - Eevee 7.5.0
on:
  push:
    paths: ['.github/workflows/eevee-experimental-mix-button.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  THEOS: ${{ github.workspace }}/theos
  SWIFTPROTOBUF_VERSION: "1.29.0"

jobs:
  build-mix-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: ${{ github.workspace }}/theos
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install make dpkg ldid wget
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Build SwiftProtobuf framework
        run: |
          set -euo pipefail
          bash Tools/SwiftProtobufBuild/build-eeveeswiftprotobuf.sh

      - name: Build experimental Eevee tweak
        run: |
          set -euo pipefail
          THEOS_PACKAGE_SCHEME=rootless make package FINALPACKAGE=1 NO_JBROOT=1
          DEB=$(find packages -name 'com.eevee.spotify_*.deb' | head -1)
          [ -n "$DEB" ] || { echo "::error::No Eevee .deb produced"; exit 1; }
          mkdir -p "$RUNNER_TEMP/extracted"
          dpkg-deb -x "$DEB" "$RUNNER_TEMP/extracted"
          DY=$(find "$RUNNER_TEMP/extracted" -name EeveeSpotify.dylib -type f | head -1)
          PBFW=$(find "$RUNNER_TEMP/extracted" -name EeveeSwiftProtobuf.framework -type d | head -1)
          [ -n "$DY" ] && [ -n "$PBFW" ] || { echo "::error::Missing tweak or protobuf"; exit 1; }
          otool -L "$DY"
          if otool -L "$DY" | grep -Ei '/var/jb|libroot|roothide'; then
            echo "::error::IPA tweak must not link jailbreak-only libraries"; exit 1
          fi
          strings "$DY" | grep -q 'header_mix_button_enabled' || { echo "::error::Experimental Mix flag missing"; exit 1; }
          echo "EEVEE_DY=$DY" >> "$GITHUB_ENV"
          echo "PROTO_FW=$PBFW" >> "$GITHUB_ENV"

      - name: Download already-patched compatible Spotify 9.2.0, without injecting twice
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://pixeldrain.com/api/file/JYNYNkbX' -o "$RUNNER_TEMP/spotify.ipa"
          unzip -tq "$RUNNER_TEMP/spotify.ipa" > /dev/null
          mkdir -p "$RUNNER_TEMP/ipa"
          unzip -q "$RUNNER_TEMP/spotify.ipa" -d "$RUNNER_TEMP/ipa"
          APP="$RUNNER_TEMP/ipa/Payload/Spotify.app"
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Info.plist")
          echo "Spotify version: $VERSION"
          [ "$VERSION" = 9.2.0 ] || { echo "::error::Expected 9.2.0"; exit 1; }
          [ -s "$APP/Frameworks/Orion.framework/Orion" ] || { echo "::error::Orion runtime missing"; exit 1; }
          [ -s "$APP/Frameworks/EeveeSpotify.dylib" ] || { echo "::error::Original tweak missing"; exit 1; }
          N=$(otool -l "$APP/Spotify" | grep -c 'name @rpath/EeveeSpotify.dylib ' || true)
          echo "Existing tweak load count: $N"
          [ "$N" = 1 ] || { echo "::error::Original IPA does not have exactly one tweak load command"; exit 1; }

      - name: Replace only tweak dylib and its framework
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/ipa/Payload/Spotify.app"
          cp "$EEVEE_DY" "$APP/Frameworks/EeveeSpotify.dylib"
          rm -rf "$APP/Frameworks/EeveeSwiftProtobuf.framework"
          cp -R "$PROTO_FW" "$APP/Frameworks/EeveeSwiftProtobuf.framework"
          codesign --force --sign - "$APP/Frameworks/EeveeSwiftProtobuf.framework"
          codesign --force --sign - "$APP/Frameworks/EeveeSpotify.dylib"
          echo "New tweak deps:"
          otool -L "$APP/Frameworks/EeveeSpotify.dylib"
          mkdir -p outputs
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/outputs/EeveeSpotify-7.5.0-Spotify-9.2.0-MixUI-EXPERIMENTAL.ipa" Payload)
          unzip -tq outputs/EeveeSpotify-7.5.0-Spotify-9.2.0-MixUI-EXPERIMENTAL.ipa >/dev/null
          test $(stat -f %z outputs/*.ipa) -gt 10000000

      - uses: actions/upload-artifact@v4
        with:
          name: EeveeSpotify-7.5.0-MixUI-EXPERIMENTAL
          path: outputs/*.ipa
          if-no-files-found: error
          retention-days: 14
