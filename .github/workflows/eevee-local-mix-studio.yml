name: Build Mix Studio two-deck iPhone IPA
on:
  push:
    paths: ['.github/workflows/eevee-local-mix-studio.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  THEOS: ${{ github.workspace }}/theos
  SWIFTPROTOBUF_VERSION: "1.29.0"
jobs:
  local-beat-mix:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: ${{ github.workspace }}/theos
          submodules: recursive
      - name: Install dependencies
        run: |
          brew install make dpkg ldid wget
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Build SwiftProtobuf framework
        run: bash Tools/SwiftProtobufBuild/build-eeveeswiftprotobuf.sh
      - name: Compile dual deck Mix Studio and local beat mix
        run: |
          set -euo pipefail
          THEOS_PACKAGE_SCHEME=rootless make package FINALPACKAGE=1 NO_JBROOT=1
          DEB=$(find packages -name 'com.eevee.spotify_*.deb' | head -1)
          [ -n "$DEB" ] || { echo "::error::No .deb"; exit 1; }
          mkdir -p "$RUNNER_TEMP/extracted"
          dpkg-deb -x "$DEB" "$RUNNER_TEMP/extracted"
          DY=$(find "$RUNNER_TEMP/extracted" -name EeveeSpotify.dylib -type f | head -1)
          PBFW=$(find "$RUNNER_TEMP/extracted" -name EeveeSwiftProtobuf.framework -type d | head -1)
          [ -n "$DY" ] && [ -n "$PBFW" ] || { echo "::error::Missing binaries"; exit 1; }
          otool -L "$DY"
          if otool -L "$DY" | tail -n +2 | grep -Ei '/var/jb|libroot|roothide'; then
            echo "::error::Jailbreak-only dependency detected"; exit 1
          fi
          grep -aFq 'LocalMixStudioProject' "$DY" || { echo "::error::Mix Studio code not present"; exit 1; }
          echo "EEVEE_DY=$DY" >> "$GITHUB_ENV"
          echo "PROTO_FW=$PBFW" >> "$GITHUB_ENV"
      - name: Download existing compatible Spotify IPA
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://pixeldrain.com/api/file/JYNYNkbX' -o "$RUNNER_TEMP/source.ipa"
          unzip -tq "$RUNNER_TEMP/source.ipa" >/dev/null
          mkdir -p "$RUNNER_TEMP/ipa"
          unzip -q "$RUNNER_TEMP/source.ipa" -d "$RUNNER_TEMP/ipa"
          APP="$RUNNER_TEMP/ipa/Payload/Spotify.app"
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Info.plist")
          [ "$VERSION" = 9.2.0 ] || { echo "::error::Spotify 9.2.0 required"; exit 1; }
          [ -s "$APP/Frameworks/SpotifyAudioProbe.dylib" ] || { echo "::error::PCM probe is required"; exit 1; }
          [ -s "$APP/Frameworks/Orion.framework/Orion" ] || { echo "::error::Orion missing"; exit 1; }
          N=$(otool -l "$APP/Spotify" | grep -c 'name @rpath/EeveeSpotify.dylib ' || true)
          [ "$N" = 1 ] || { echo "::error::Expected exactly one existing Eevee load command"; exit 1; }
      - name: Repackage and validate
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/ipa/Payload/Spotify.app"
          cp "$EEVEE_DY" "$APP/Frameworks/EeveeSpotify.dylib"
          rm -rf "$APP/Frameworks/EeveeSwiftProtobuf.framework"
          cp -R "$PROTO_FW" "$APP/Frameworks/EeveeSwiftProtobuf.framework"
          codesign --force --sign - "$APP/Frameworks/EeveeSwiftProtobuf.framework"
          codesign --force --sign - "$APP/Frameworks/EeveeSpotify.dylib"
          mkdir -p outputs
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/outputs/EeveeSpotify-9.2.0-MixStudio-TWO-DECK-TEST.ipa" Payload)
          unzip -tq outputs/*.ipa >/dev/null
          ls -lh outputs/*.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: EeveeSpotify-9.2.0-MixStudio-TWO-DECK-TEST
          path: outputs/*.ipa
          if-no-files-found: error
          retention-days: 14
