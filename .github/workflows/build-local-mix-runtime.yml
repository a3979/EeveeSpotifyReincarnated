name: Build Local Mix Runtime (no Spotify IPA download)

on:
  push:
    paths:
      - '.github/workflows/build-local-mix-runtime.yml'
      - 'Sources/EeveeSpotify/LocalMix/**'
      - 'Sources/EeveeSpotify/Settings/Views/EeveeSettingsView.swift'
      - 'Sources/EeveeSpotify/Tweak.x.swift'
      - 'Scripts/run-tests.sh'
      - 'Tests/LocalMixMath/**'
      - 'layout/Library/Application Support/EeveeSpotify.bundle/en.lproj/Localizable.strings'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-mix-runtime-${{ github.ref }}
  cancel-in-progress: true

env:
  THEOS: ${{ github.workspace }}/theos
  SWIFTPROTOBUF_VERSION: "1.29.0"

jobs:
  build-runtime:
    runs-on: macos-latest
    steps:
      - name: Checkout project source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          submodules: recursive

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: ${{ github.workspace }}/theos
          submodules: recursive

      - name: Install build tools
        run: |
          set -euo pipefail
          brew install make dpkg ldid wget
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Run regression tests
        run: bash Scripts/run-tests.sh

      - name: Build EeveeSwiftProtobuf framework
        run: |
          set -euo pipefail
          chmod +x Tools/SwiftProtobufBuild/build-eeveeswiftprotobuf.sh
          Tools/SwiftProtobufBuild/build-eeveeswiftprotobuf.sh

      - name: Compile EeveeSpotify from this branch
        env:
          REPO_SLUG: ${{ github.repository }}
        run: |
          set -euo pipefail
          THEOS_PACKAGE_SCHEME=rootless make package FINALPACKAGE=1 NO_JBROOT=1
          DEB=$(find packages -name 'com.eevee.spotify_*.deb' -type f | head -1)
          [ -n "$DEB" ] || { echo "::error::Eevee .deb was not produced"; exit 1; }
          mkdir -p "$RUNNER_TEMP/deb" "$RUNNER_TEMP/runtime/Frameworks" outputs
          dpkg-deb -x "$DEB" "$RUNNER_TEMP/deb"
          DY=$(find "$RUNNER_TEMP/deb" -name EeveeSpotify.dylib -type f | head -1)
          PROTO=$(find "$RUNNER_TEMP/deb" -type d -name EeveeSwiftProtobuf.framework | head -1)
          BUNDLE=$(find "$RUNNER_TEMP/deb" -type d -name EeveeSpotify.bundle | head -1)
          [ -n "$DY" ] && [ -n "$PROTO" ] || { echo "::error::Tweak dylib or Protobuf framework missing"; exit 1; }
          otool -L "$DY"
          if otool -L "$DY" | tail -n +2 | grep -Ei '/var/jb|libroot|roothide'; then
            echo "::error::Jailbreak-only dependency found"; exit 1
          fi
          grep -aFq 'LocalMixStudio' "$DY" || { echo "::error::Local Mix Studio code missing"; exit 1; }
          grep -aFq 'Manual crossfader ready' "$DY" || { echo "::error::Manual crossfader code missing"; exit 1; }
          cp "$DY" "$RUNNER_TEMP/runtime/Frameworks/EeveeSpotify.dylib"
          cp -R "$PROTO" "$RUNNER_TEMP/runtime/Frameworks/"
          if [ -n "$BUNDLE" ] && [ -d "$BUNDLE" ]; then
            cp -R "$BUNDLE" "$RUNNER_TEMP/runtime/"
          fi

      - name: Fetch Orion runtime
        run: |
          set -euo pipefail
          curl --fail --location --retry 3             'https://github.com/zbzxbg/es-build-tools/releases/download/v1.0.0/Orion.zip'             -o "$RUNNER_TEMP/Orion.zip"
          mkdir -p "$RUNNER_TEMP/orion"
          unzip -q "$RUNNER_TEMP/Orion.zip" -d "$RUNNER_TEMP/orion"
          rm -rf "$RUNNER_TEMP/orion/__MACOSX"
          ORION=$(find "$RUNNER_TEMP/orion" -type d -name Orion.framework -not -path '*__MACOSX*' | head -1)
          [ -n "$ORION" ] && [ -s "$ORION/Orion" ] || { echo "::error::Orion.framework binary missing"; exit 1; }
          cp -R "$ORION" "$RUNNER_TEMP/runtime/Frameworks/"

      - name: Package runtime artifact
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP/runtime" && zip -qry "$GITHUB_WORKSPACE/outputs/EeveeSpotify-LocalMixRuntime.zip" .)
          unzip -tq outputs/EeveeSpotify-LocalMixRuntime.zip >/dev/null
          {
            echo "### Local Mix runtime"
            echo "- Current branch source compiled"
            echo "- EeveeSpotify.dylib, EeveeSwiftProtobuf, Orion and bundle packaged"
            echo "- No Spotify IPA was downloaded or redistributed"
            echo "- Runtime is intended for injection into the user's own decrypted Spotify 9.2.2 IPA"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: EeveeSpotify-LocalMixRuntime
          path: outputs/EeveeSpotify-LocalMixRuntime.zip
          if-no-files-found: error
          retention-days: 14
