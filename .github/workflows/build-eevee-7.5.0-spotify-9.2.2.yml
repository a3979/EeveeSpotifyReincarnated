name: Build EeveeSpotify 7.5.0 + Local Beat Mix (Spotify 9.2.2)

on:
  push:
    paths:
      - 'Sources/EeveeSpotify/LocalMix/**'
      - 'Sources/EeveeSpotify/Settings/Views/EeveeSettingsView.swift'
      - 'Sources/EeveeSpotify/Tweak.x.swift'
      - 'Scripts/run-tests.sh'
      - 'Tests/LocalMixMath/**'
      - 'Makefile'
      - 'Sources/EeveeSpotify/EeveeCrossfadeForce.x.swift'
      - 'Sources/EeveeSpotify/Pages/PlaylistActionRow.swift'
      - 'Sources/EeveeSpotify/Pages/GlassPlaylist.x.swift'
      - 'Sources/EeveeSpotify/LiquidGlass/LiquidGlass.x.swift'
      - 'Sources/EeveeSpotify/Settings/Sections/Miscellaneous/Views/EeveeLocalMixSettingsView.swift'
      - 'Sources/EeveeSpotify/Settings/Views/EeveeSettingsView.swift'
      - 'Sources/EeveeSpotifyC/**'
      - 'NativeDownloads/src/Diagnostics/AVAudioHooks.m'
      - 'NativeDownloads/src/Diagnostics/AudioProbe.c'
      - 'NativeDownloads/src/Diagnostics/DiagnosticsPreferences.m'
      - 'NativeDownloads/src/Diagnostics/AudioProbeBackend.h'
      - 'NativeDownloads/src/Public/Diagnostics.h'
      - 'modules/fishhook/**'
      - 'NativeDownloads/src/Public/AudioProbe.h'
  workflow_dispatch:
    inputs:
      ipa_url:
        description: Direct HTTPS URL to your own decrypted Spotify 9.2.2 IPA. This must be a real 9.2.2 file, not a webpage or 9.2.0 link.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: local-mix-studio-${{ github.ref }}
  cancel-in-progress: true

env:
  THEOS: ${{ github.workspace }}/theos
  SWIFTPROTOBUF_VERSION: "1.29.0"

jobs:
  build-local-mix-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout project source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          submodules: recursive

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: ${{ github.workspace }}/theos
          submodules: recursive

      - name: Install build tools
        run: |
          set -euo pipefail
          brew install make dpkg ldid wget
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          python3 -m pip install --upgrade --break-system-packages git+https://github.com/asdfzxcvbn/pyzule-rw.git
          command -v cyan

      - name: Run regression tests
        run: |
          set -euo pipefail
          bash Scripts/run-tests.sh

      - name: Build EeveeSwiftProtobuf framework
        run: |
          set -euo pipefail
          chmod +x Tools/SwiftProtobufBuild/build-eeveeswiftprotobuf.sh
          Tools/SwiftProtobufBuild/build-eeveeswiftprotobuf.sh

      - name: Compile EeveeSpotify from this branch
        id: compile
        env:
          REPO_SLUG: ${{ github.repository }}
        run: |
          set -euo pipefail
          THEOS_PACKAGE_SCHEME=rootless make package FINALPACKAGE=1 NO_JBROOT=1
          DEB=$(find packages -name 'com.eevee.spotify_*.deb' -type f | head -1)
          [ -n "$DEB" ] || { echo "::error::Eevee .deb was not produced"; exit 1; }
          mkdir -p "$RUNNER_TEMP/deb"
          dpkg-deb -x "$DEB" "$RUNNER_TEMP/deb"
          DY=$(find "$RUNNER_TEMP/deb" -name EeveeSpotify.dylib -type f | head -1)
          PROTO=$(find "$RUNNER_TEMP/deb" -type d -name EeveeSwiftProtobuf.framework | head -1)
          BUNDLE=$(find "$RUNNER_TEMP/deb" -type d -name EeveeSpotify.bundle | head -1)
          [ -n "$DY" ] && [ -n "$PROTO" ] || { echo "::error::Tweak dylib or EeveeSwiftProtobuf framework missing"; exit 1; }
          otool -L "$DY"
          if otool -L "$DY" | tail -n +2 | grep -Ei '/var/jb|libroot|roothide'; then
            echo "::error::IPA build must not link jailbreak-only libraries"; exit 1
          fi
          grep -aFq 'LocalMixStudio' "$DY" || { echo "::error::Optional local-file studio code missing from compiled dylib"; exit 1; }
          grep -aFq 'Manual crossfader ready' "$DY" || { echo "::error::Optional local-file studio code missing from compiled dylib"; exit 1; }
          for symbol in SpotifyAudioProbeSetObserver AudioUnitSetProperty EeveeLocalMixInstallAudioProbe; do
            nm -gU "$DY" | grep -q "$symbol" || { echo "::error::Local Beat Mix audio hook missing: $symbol"; exit 1; }
          done
          mkdir -p outputs
          cp "$DEB" outputs/com.eevee.spotify-localmix.deb
          echo "EEVEE_DY=$DY" >> "$GITHUB_ENV"
          echo "PROTO_FW=$PROTO" >> "$GITHUB_ENV"
          echo "EEVEE_BUNDLE=$BUNDLE" >> "$GITHUB_ENV"

      - name: Upload compiled Eevee package
        uses: actions/upload-artifact@v4
        if: steps.compile.outcome == 'success'
        with:
          name: EeveeSpotify-LocalMixStudio-compiled-deb
          path: outputs/com.eevee.spotify-localmix.deb
          if-no-files-found: error
          retention-days: 14

      - name: Explain compile-only push build
        if: github.event_name == 'push'
        run: |
          {
            echo "### Local Beat Mix source build"
            echo "- Regression tests: passed"
            echo "- EeveeSpotify tweak: compiled with Local Beat Mix PCM hooks"
            echo "- Compiled package uploaded as a separate artifact"
            echo "- IPA packaging is reserved for workflow_dispatch with a user-supplied Spotify 9.2.2 URL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download and validate Spotify 9.2.2 base IPA
        if: github.event_name == 'workflow_dispatch'
        env:
          IPA_URL: ${{ github.event.inputs.ipa_url }}
        run: |
          set -euo pipefail
          case "$IPA_URL" in https://*) ;; *) echo "::error::A direct HTTPS IPA URL is required"; exit 1;; esac
          case "$IPA_URL" in
            https://filebin.net/*)
              # Filebin first returns a one-time verification cookie; request again with it
              # so curl receives the actual IPA rather than the HTML interstitial.
              COOKIE_JAR="$RUNNER_TEMP/filebin-cookies.txt"
              curl --fail --silent --show-error -c "$COOKIE_JAR" -o /dev/null "$IPA_URL"
              curl --fail --location --retry 3 --silent --show-error -b "$COOKIE_JAR" -c "$COOKIE_JAR" "$IPA_URL" -o "$RUNNER_TEMP/spotify.ipa"
              ;;
            *)
              curl --fail --location --retry 3 "$IPA_URL" -o "$RUNNER_TEMP/spotify.ipa"
              ;;
          esac
          unzip -tq "$RUNNER_TEMP/spotify.ipa" >/dev/null
          INFO="$RUNNER_TEMP/spotify-info.plist"
          unzip -p "$RUNNER_TEMP/spotify.ipa" Payload/Spotify.app/Info.plist > "$INFO"
          BUNDLE_ID=$(plutil -extract CFBundleIdentifier raw "$INFO")
          VERSION=$(plutil -extract CFBundleShortVersionString raw "$INFO")
          BUILD=$(plutil -extract CFBundleVersion raw "$INFO")
          echo "Spotify bundle: $BUNDLE_ID"
          echo "Spotify version: $VERSION ($BUILD)"
          [ "$BUNDLE_ID" = "com.spotify.client" ] || { echo "::error::Unexpected bundle identifier: $BUNDLE_ID"; exit 1; }
          [ "$VERSION" = "9.2.2" ] || { echo "::error::Expected Spotify 9.2.2, received $VERSION"; exit 1; }

      - name: Fetch Orion runtime
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3             'https://github.com/zbzxbg/es-build-tools/releases/download/v1.0.0/Orion.zip'             -o "$RUNNER_TEMP/Orion.zip"
          mkdir -p "$RUNNER_TEMP/orion"
          unzip -q "$RUNNER_TEMP/Orion.zip" -d "$RUNNER_TEMP/orion"
          rm -rf "$RUNNER_TEMP/orion/__MACOSX"
          ORION=$(find "$RUNNER_TEMP/orion" -type d -name Orion.framework -not -path '*__MACOSX*' | head -1)
          [ -n "$ORION" ] && [ -s "$ORION/Orion" ] || { echo "::error::Orion.framework binary missing"; exit 1; }
          echo "ORION_FW=$ORION" >> "$GITHUB_ENV"

      - name: Inject freshly compiled Eevee + required frameworks
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          mkdir -p outputs
          ADD=("$EEVEE_DY" "$ORION_FW" "$PROTO_FW")
          if [ -n "${EEVEE_BUNDLE:-}" ] && [ -d "$EEVEE_BUNDLE" ]; then ADD+=("$EEVEE_BUNDLE"); fi
          cyan -i "$RUNNER_TEMP/spotify.ipa"             -o outputs/EeveeSpotify-7.5.0-Spotify-9.2.2-LocalBeatMix.ipa             -f "${ADD[@]}" -c 9 -m 16.1 -du
          chmod +x Tools/strip-ipa.sh
          Tools/strip-ipa.sh outputs/EeveeSpotify-7.5.0-Spotify-9.2.2-LocalBeatMix.ipa

      - name: Validate packaged IPA
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          IPA=outputs/EeveeSpotify-7.5.0-Spotify-9.2.2-LocalBeatMix.ipa
          unzip -tq "$IPA" >/dev/null
          mkdir -p "$RUNNER_TEMP/verify"
          unzip -q "$IPA" -d "$RUNNER_TEMP/verify"
          APP="$RUNNER_TEMP/verify/Payload/Spotify.app"
          BUNDLE_ID=$(plutil -extract CFBundleIdentifier raw "$APP/Info.plist")
          VERSION=$(plutil -extract CFBundleShortVersionString raw "$APP/Info.plist")
          [ "$BUNDLE_ID" = "com.spotify.client" ] || { echo "::error::Packaged bundle identifier changed"; exit 1; }
          [ "$VERSION" = "9.2.2" ] || { echo "::error::Packaged Spotify version changed"; exit 1; }
          test -s "$APP/Frameworks/EeveeSpotify.dylib"
          test -s "$APP/Frameworks/Orion.framework/Orion"
          test -s "$APP/Frameworks/EeveeSwiftProtobuf.framework/EeveeSwiftProtobuf"
          for symbol in SpotifyAudioProbeSetObserver AudioUnitSetProperty EeveeLocalMixInstallAudioProbe; do
            nm -gU "$APP/Frameworks/EeveeSpotify.dylib" | grep -q "$symbol" || { echo "::error::Packaged Local Beat Mix audio hook missing: $symbol"; exit 1; }
          done
          otool -L "$APP/Frameworks/EeveeSpotify.dylib"
          if otool -L "$APP/Frameworks/EeveeSpotify.dylib" | tail -n +2 | grep -Ei '/var/jb|libroot|roothide'; then
            echo "::error::Jailbreak-only dependency found in final IPA"; exit 1
          fi
          echo "IPA ZIP integrity, Spotify version, tweak, Orion, Protobuf and Local Beat Mix PCM hooks verified."
          echo "Physical iPhone playback and Sideloadly signing still require device testing."
          {
            echo "### Local Beat Mix build"
            echo "- Spotify base: 9.2.2"
            echo "- Local Beat Mix: bundled AudioUnit and AVFoundation PCM observation"
            echo "- On-device BPM estimate adjusts Spotify's native crossfade to a 4/8/16-beat duration"
            echo "- Uses Spotify's existing playback and crossfade engine; no cloud AutoMix call"
            echo "- Not yet implemented: independent streaming decks, per-track cue points, tempo/key matching or the Premium Mix editor"
            echo "- Optional Local File Mix Studio remains a separate imported-audio player"
            echo "- iPhone playback test: not yet performed"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: EeveeSpotify-7.5.0-Spotify-9.2.2-LocalBeatMix
          path: outputs/EeveeSpotify-7.5.0-Spotify-9.2.2-LocalBeatMix.ipa
          if-no-files-found: error
          retention-days: 14
